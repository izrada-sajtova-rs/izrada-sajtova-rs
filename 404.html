    <link rel="stylesheet" href="css/style.css">
<!-- Event snippet for Click to call conversion page
In your html page, add the snippet and call gtag_report_conversion when someone clicks on the chosen link or button. -->
<script>
function gtag_report_conversion(url) {
  var callback = function () {
    if (typeof(url) != 'undefined') {
      window.location = url;
    }
  };
  gtag('event', 'conversion', {
      'send_to': 'AW-18141607037/JePsCOeFsqgcEP3oy8pD',
      'event_callback': callback
  });
  return false;
}
</script>
</head>
<body>
    <div class="error-page container">
        <h1>404</h1>
        <h2>Stranica nije pronađena</h2>
        <p>Stranica koju tražite ne postoji ili je premeštena.</p>
        <a href="index.html" class="button">Povratak na početnu</a>
    </div>
    <script>
  let googleTagLoaded = false;

  function loadGoogleTag() {
    if (googleTagLoaded) return;
    googleTagLoaded = true;

    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-TLJFZZKZF5';
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () {
      dataLayer.push(arguments);
    };

    gtag('js', new Date());

    // Google Analytics
    gtag('config', 'G-TLJFZZKZF5');

    // Google Ads
    gtag('config', 'AW-18141607037');
  }

  window.addEventListener('scroll', loadGoogleTag, { once: true, passive: true });
  window.addEventListener('mousemove', loadGoogleTag, { once: true, passive: true });
  window.addEventListener('touchstart', loadGoogleTag, { once: true, passive: true });
  window.addEventListener('click', loadGoogleTag, { once: true, passive: true });

  window.addEventListener('load', function () {
    setTimeout(loadGoogleTag, 4000);
  });

  function gtag_report_conversion(url) {
    const callback = function () {
      if (typeof url !== 'undefined') {
        window.location = url;
      }
    };

    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
        'send_to': 'AW-18141607037/JePsCOeFsqgcEP3oy8pD',
        'event_callback': callback,
        'event_timeout': 1500
      });

      return false;
    }

    callback();
    return false;
  }
</script>
</body>
