    <script>
  let googleTagLoaded = false;

  function loadGoogleTag() {
    if (googleTagLoaded) return;
    googleTagLoaded = true;

    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=G-TLJFZZKZF5';
    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];
    window.gtag = function () {
      dataLayer.push(arguments);
    };

    gtag('js', new Date());

    // Google Analytics
    gtag('config', 'G-TLJFZZKZF5');

    // Google Ads
    gtag('config', 'AW-18141607037');
  }

  // Google tag ne sme da blokira glavnu nit dok traju hero animacije: ucitava se tek posle ~4s od otvaranja strane,
  // kada stranica miruje (cak i ako je korisnik odmah pomerio misa ili skrolovao).
  let googleTagScheduled = false;
  function scheduleGoogleTag() {
    if (googleTagLoaded || googleTagScheduled) return;
    googleTagScheduled = true;
    const wait = Math.max(0, 4000 - performance.now());
    setTimeout(function () {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGoogleTag, { timeout: 2000 });
      } else {
        loadGoogleTag();
      }
    }, wait);
  }

  ['scroll', 'mousemove', 'touchstart', 'click'].forEach(function (evt) {
    window.addEventListener(evt, scheduleGoogleTag, { once: true, passive: true });
  });

  window.addEventListener('load', function () {
    setTimeout(scheduleGoogleTag, 1000);
  });

  function gtag_report_conversion(url) {
    const callback = function () {
      if (typeof url !== 'undefined') {
        window.location = url;
      }
    };

    if (typeof gtag === 'function') {
      gtag('event', 'conversion', {
        'send_to': 'AW-18141607037/JePsCOeFsqgcEP3oy8pD',
        'event_callback': callback,
        'event_timeout': 1500
      });

      return false;
    }

    callback();
    return false;
  }
</script>
